# ryvexd control plane: Deployment + Service.
#
# - Liveness hits /healthz (unauthenticated per docs/api-contracts.md);
#   readiness hits /readyz, the dependency-aware probe (issue #71), and
#   a startupProbe gates BOTH until first-boot migrations finish (#76).
# - State: --store postgres, DSN assembled from the postgres credentials in
#   ryvexd-secret (RYVEX_DATABASE_URL references $(POSTGRES_PASSWORD), which
#   Kubernetes expands from the env entry defined above it). The sslmode
#   comes from the RYVEX_PG_SSLMODE config entry (02-ryvexd-configmap.yaml)
#   so TLS can be switched on without editing this file (#76).
# - Bus: memory by default. To move to durable JetStream replay add
#   "--bus", "nats" to args and deploy a NATS service reachable at the
#   RYVEX_NATS_URL from 02-ryvexd-configmap.yaml. There is no env
#   equivalent for --bus (cmd/ryvexd/serve.go), so the switch is a
#   deliberate args edit — see docs/deploy.md "Event bus choice" (#76).
# - Image: ghcr.io/roy-wanyoike/ryvexd, published by the release
#   workflow on every `v*` tag. Override the tag without editing YAML:
#   `kubectl apply -k deploy/k8s` (see deploy/k8s/kustomization.yaml).
# - Network: 05-ryvexd-networkpolicy.yaml default-denies ingress/egress
#   around this workload; 06-ryvexd-pdb.yaml protects it from voluntary
#   drains.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ryvexd
  namespace: ryvex
  labels:
    app.kubernetes.io/name: ryvexd
    app.kubernetes.io/part-of: ryvex
spec:
  # One control-plane replica today; HA/federation is on the roadmap.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ryvexd
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ryvexd
        app.kubernetes.io/part-of: ryvex
    spec:
      # Pod-level hardening (issue #76): default seccomp profile; the
      # container-level context below was already non-root with all
      # caps dropped.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ryvexd
          image: ghcr.io/roy-wanyoike/ryvexd:v1.1.0
          imagePullPolicy: IfNotPresent
          args: ["serve", "--store", "postgres"]
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9090
          env:
            - name: RYVEX_HTTP_ADDR
              valueFrom:
                configMapKeyRef:
                  name: ryvexd-config
                  key: RYVEX_HTTP_ADDR
            - name: RYVEX_METRICS_ADDR
              valueFrom:
                configMapKeyRef:
                  name: ryvexd-config
                  key: RYVEX_METRICS_ADDR
            - name: RYVEX_CORS_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: ryvexd-config
                  key: RYVEX_CORS_ORIGINS
            - name: RYVEX_NATS_URL
              valueFrom:
                configMapKeyRef:
                  name: ryvexd-config
                  key: RYVEX_NATS_URL
            - name: RYVEX_API_KEYS
              valueFrom:
                secretKeyRef:
                  name: ryvexd-secret
                  key: api-keys
            - name: RYVEX_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: ryvexd-secret
                  key: webhook-secret
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ryvexd-secret
                  key: postgres-password
            - name: RYVEX_PG_SSLMODE
              # Defined BEFORE RYVEX_DATABASE_URL so the $(...) expansion
              # below picks it up; see 02-ryvexd-configmap.yaml for the
              # disable vs verify-full trade-off.
              valueFrom:
                configMapKeyRef:
                  name: ryvexd-config
                  key: RYVEX_PG_SSLMODE
            - name: RYVEX_DATABASE_URL
              value: "postgres://ryvex:$(POSTGRES_PASSWORD)@ryvex-postgres.ryvex.svc.cluster.local:5432/ryvex?sslmode=$(RYVEX_PG_SSLMODE)"
          startupProbe:
            httpGet:
              # Gates liveness AND readiness until the first boot is
              # done: --store postgres runs the embedded migrations
              # (internal/state/pgstore) under a 30s context, and a cold
              # PVC + image pull can add more. Without this gate the
              # liveness clock started at container start and could kill
              # a healthy pod mid-migration (issue #76). 30 x 5s = 150s
              # of grace; once it succeeds, liveness/readiness below
              # take over immediately.
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet:
              # /healthz stays on livenessProbe: it keeps 200 semantics
              # and does not restart the pod for a dependency failure a
              # restart cannot fix (issue #71).
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          readinessProbe:
            httpGet:
              # /readyz is dependency-aware (issue #71): it answers a
              # real store+bus query and 503s while Postgres (or the
              # bus) is down, so a dead-DB pod leaves the Service
              # rotation instead of serving errors.
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: ryvexd
  namespace: ryvex
  labels:
    app.kubernetes.io/name: ryvexd
    app.kubernetes.io/part-of: ryvex
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ryvexd
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: metrics
      port: 9090
      targetPort: metrics
