# Secret TEMPLATE for ryvexd. The values below are placeholders — replace
# every CHANGE_ME before applying, or (better) skip this file and create
# the secret out-of-band:
#
#   kubectl -n ryvex create secret generic ryvexd-secret \
#     --from-literal=api-keys="ops=ryk_$(openssl rand -hex 24)" \
#     --from-literal=webhook-secret="$(openssl rand -hex 32)" \
#     --from-literal=postgres-password="$(openssl rand -hex 16)" \
#     --from-literal=agent-token="ryk_$(openssl rand -hex 24)"
#
# Never commit real values. This template exists so the Deployments have a
# well-defined key contract:
#   api-keys          RYVEX_API_KEYS   comma-separated name=token pairs (ryk_…)
#   webhook-secret    RYVEX_WEBHOOK_SECRET  HMAC key for webhook signatures
#   postgres-password POSTGRES_PASSWORD / RYVEX_DATABASE_URL credentials
#   agent-token       RYVEX_AGENT_TOKEN  key the node agent heartbeats with
#                     (07-ryvex-agent.yaml); MUST be a managed or static
#                     key whose scope covers the agent's org/project/env
#
# ISSUE #76 (fail closed): the `stringData` block is COMMENTED OUT. The
# previous template shipped applyable CHANGE_ME placeholders, so a plain
# `kubectl apply -f deploy/k8s/` booted the stack with publicly-known
# credentials (the api-keys placeholder is even a syntactically valid
# ryk_ token). Now the same apply leaves the Secret empty and the pods
# refuse to start (CreateContainerConfigError) until real secrets exist
# — the command above, or an uncommented + edited copy of this file.
apiVersion: v1
kind: Secret
metadata:
  name: ryvexd-secret
  namespace: ryvex
  labels:
    app.kubernetes.io/name: ryvexd
    app.kubernetes.io/part-of: ryvex
type: Opaque
