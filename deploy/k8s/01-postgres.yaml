# Durable state backend for ryvexd --store postgres.
# Headless Service (stable DNS for the StatefulSet pod) + StatefulSet with
# a PVC template so resource generations and audit history survive restarts.
#
# The Postgres credentials come from the ryvexd-secret template
# (03-ryvexd-secret.yaml): key postgres-password.
#
# Hardening (issue #76): the pod runs as UID/GID 999 — the `postgres`
# user baked into the official image — with fsGroup handing the PVC to
# group 999, all capabilities dropped and the default seccomp profile.
# Running the entrypoint as non-root makes it skip its root-only
# bootstrap (chown + su-exec), which is exactly what we want; initdb
# still runs, as the postgres user, against the fsGroup-owned volume.
# NOTE: a data volume first written by a root-run postgres (e.g. from a
# previous un-hardened apply) needs a one-time chown -R 999:999 before
# this manifest can adopt it.
apiVersion: v1
kind: Service
metadata:
  name: ryvex-postgres
  namespace: ryvex
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: ryvex
spec:
  clusterIP: None # headless: stable per-pod DNS for the StatefulSet
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: pg
      port: 5432
      targetPort: pg
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ryvex-postgres
  namespace: ryvex
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: ryvex
spec:
  serviceName: ryvex-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: ryvex
    spec:
      # Pod-level securityContext (issue #76). UID 999 = postgres in the
      # official image; fsGroup 999 makes the mounted PVC group-writable
      # for it (the kubelet chowns new volumes once at mount time).
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          # Postgres binds 5432 (>1024) as its own user and needs no
          # kernel privileges, so ALL caps can go.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: pg
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: ryvex
            - name: POSTGRES_DB
              value: ryvex
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ryvexd-secret
                  key: postgres-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata # keep the PVC mount root clean
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "ryvex", "-d", "ryvex"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "ryvex", "-d", "ryvex"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
