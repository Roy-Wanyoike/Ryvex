# Ryvex self-hosted stack (issue #35; agent added by #76).
#
#   docker compose up -d                   # postgres + ryvexd (memory event bus)
#   docker compose --profile nats up -d    # additionally enable the NATS JetStream bus
#   docker compose --profile agent up -d   # additionally run the node agent (needs RYVEX_AGENT_TOKEN)
#
# ryvexd ships prebuilt inside the image (see Dockerfile); the agent is
# built by Dockerfile.agent (see below). No Go/Rust toolchain is
# required on the host.
#
# Credentials are env-configurable: compose reads a .env file placed
# next to this file, or you can export the variables in your shell.
# The in-file defaults are for local development ONLY — override them
# before exposing the stack beyond loopback:
#
#   POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB
#   RYVEX_API_KEYS       REQUIRED — no default ships (fail closed, #119):
#                        generate with "openssl rand -hex 32" (see ryvexd)
#   RYVEX_WEBHOOK_SECRET / RYVEX_CORS_ORIGINS / RYVEX_NATS_URL
#
# Backups (run from the host; the dump lands in your current directory):
#
#   docker compose exec postgres pg_dump -U "${POSTGRES_USER:-postgres}" \
#       "${POSTGRES_DB:-ryvex}" > ryvex-backup.sql
#
#   # restore:
#   docker compose exec -T postgres psql -U "${POSTGRES_USER:-postgres}" \
#       "${POSTGRES_DB:-ryvex}" < ryvex-backup.sql
#
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ryvex}
    ports:
      # Loopback only: the database must never be reachable off-host by
      # default. Containers reach it over the compose network as host
      # "postgres", not via this published port.
      - "127.0.0.1:5432:5432"
    volumes:
      - ryvex-pgdata:/var/lib/postgresql/data
    healthcheck:
      # Interpolated from the same env vars as the credentials above, so
      # the probe always targets the database that was actually created.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ryvex}"]
      interval: 5s
      timeout: 3s
      retries: 10

  ryvexd:
    build: .
    restart: unless-stopped
    # --store and --bus have no RYVEX_* env equivalents, so they must
    # live on the command line; every other flag is wired through the
    # environment block below. To switch to the durable NATS bus once
    # the "nats" profile is enabled, extend this to:
    #   ["serve", "--store", "postgres", "--bus", "nats"]
    # (ryvexd deliberately refuses to fall back to the memory bus when
    # --bus=nats fails to connect.)
    command: ["serve", "--store", "postgres"]
    environment:
      # In-container host is the compose service name "postgres", not
      # 127.0.0.1. sslmode=disable is acceptable only because traffic
      # never leaves the compose network; switch to verify-full with a
      # managed Postgres.
      RYVEX_DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-ryvex}?sslmode=disable
      # ISSUE #119 (fail closed): NO applyable known-credential default.
      # The previously-defaulted sample booted every `docker compose up`
      # with a publicly-known admin token — mirroring the k8s Secret
      # template fix (deploy/k8s/03-ryvexd-secret.yaml, issue #76).
      # Generate real keys and keep them out of git — put them in a .env
      # file next to this one (see .env.example) or export them in your
      # shell:
      #
      #   echo "RYVEX_API_KEYS=admin=ryk_$(openssl rand -hex 32)" >> .env
      #
      # Multiple keys: comma-separated name=token pairs. With the
      # variable unset, ryvexd boots WITHOUT any bootstrap admin key:
      # /healthz and /readyz answer, every /v1 request is rejected (the
      # daemon logs "no API keys configured"), and the stack stays
      # unusable by design until a real key is configured.
      # RYVEX_API_KEYS: admin=ryk_CHANGE_ME_generate_with_openssl_rand_hex_32
      # Empty (default) = webhook signatures use a fresh random secret per
      # boot; set a fixed value for stable signatures across restarts.
      RYVEX_WEBHOOK_SECRET: ${RYVEX_WEBHOOK_SECRET:-}
      # Set to the console origin (e.g. http://localhost:3000) when a
      # browser client needs to call the API cross-origin.
      RYVEX_CORS_ORIGINS: ${RYVEX_CORS_ORIGINS:-}
      # Pre-wired for the optional "nats" profile; harmless while
      # --bus stays "memory".
      RYVEX_NATS_URL: ${RYVEX_NATS_URL:-nats://nats:4222}
      # Uncomment to expose /metrics on a second listener (issue #17):
      # RYVEX_METRICS_ADDR: ":9090"
    ports:
      # Loopback only (issue #119): a plain `docker compose up` must not
      # publish the control plane on all interfaces — the previous
      # "8080:8080" binding made the API reachable from the whole LAN,
      # which (combined with the known-credential default that used to
      # ship in this file) handed the admin face to the local network. To
      # intentionally expose the API beyond loopback, change this
      # binding (e.g. to "8080:8080") and put a reverse proxy / auth
      # gateway in front — do not simply open the port.
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    # The image already defines this probe (wget + /healthz); the
    # explicit copy keeps compose self-documenting and lets future
    # services gate on ryvexd health via depends_on.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # Optional node agent (issue #76): enrolls its host with the control
  # plane and heartbeats (GET/PUT only — it opens no listen port). Opt-in
  # via the "agent" profile so plain `docker compose up` stays unchanged:
  #
  #   RYVEX_AGENT_TOKEN=ryk_... docker compose --profile agent up -d
  #
  # The token must be a real ryk_ API key (POST /v1/keys, or a static
  # --api-keys entry): the binary refuses an empty or non-ryk_ token and
  # would exit(2) — restart: unless-stopped would then loop it. Every
  # variable name below is verbatim from agent/ryvex-agent/src/config.rs
  # (all 9 are listed in .env.example).
  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    image: ryvex-agent:local
    profiles: ["agent"]
    restart: unless-stopped
    environment:
      # In-container host is the compose service name "ryvexd".
      RYVEX_AGENT_API: http://ryvexd:8080
      # Required. Left soft-defaulted (the agent fails fast on empty)
      # so compose config parsing never hard-errors for people who
      # never enable the "agent" profile.
      RYVEX_AGENT_TOKEN: ${RYVEX_AGENT_TOKEN:-}
      # Node resource name. Unset => the agent uses the container
      # HOSTNAME (unique per container, changes on recreate). Prefer
      # pinning a stable name for anything you keep:
      # RYVEX_AGENT_NAME: my-laptop
      RYVEX_AGENT_CLUSTER: ${RYVEX_AGENT_CLUSTER:-compose-local}
      RYVEX_AGENT_ORG: ${RYVEX_AGENT_ORG:-acme}
      RYVEX_AGENT_PROJECT: ${RYVEX_AGENT_PROJECT:-core}
      RYVEX_AGENT_ENV: ${RYVEX_AGENT_ENV:-prod}
      RYVEX_AGENT_INTERVAL: ${RYVEX_AGENT_INTERVAL:-10}
      RYVEX_AGENT_SPEC_REFRESH_SECS: ${RYVEX_AGENT_SPEC_REFRESH_SECS:-300}
    depends_on:
      ryvexd:
        condition: service_healthy
    # No healthcheck: the agent has no HTTP endpoint (client only).

  # Optional durable event bus (NATS JetStream, issue #15). Deliberately
  # behind a compose profile so plain `docker compose up` stays
  # lightweight — ryvexd's memory bus is the default and needs no extra
  # service. Enable with:
  #
  #   docker compose --profile nats up -d
  #
  # then add "--bus", "nats" to the ryvexd command (see comment above).
  # -js enables JetStream (required by ryvexd's natsbus); -m 8222 adds
  # the monitoring endpoint used by the healthcheck.
  nats:
    image: nats:2-alpine
    profiles: ["nats"]
    restart: unless-stopped
    command: ["-js", "-m", "8222"]
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8222/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  ryvex-pgdata:
  nats-data:
