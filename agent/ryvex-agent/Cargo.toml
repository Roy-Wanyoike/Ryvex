[package]
name = "ryvex-agent"
version = "1.0.0"
edition = "2021"
description = "Ryvex data-plane node agent: enrolls with the control plane, heartbeats, self-heals"
license = "Apache-2.0"
repository = "https://github.com/Roy-Wanyoike/Ryvex"

[[bin]]
name = "ryvex-agent"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
