[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ryvex"
version = "1.0.0"
description = "Official Python client for the Ryvex control plane REST API (/v1 face)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Ryvex team" }]
keywords = ["ryvex", "control-plane", "client", "sdk", "api"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [] # stdlib-only runtime: urllib.request + json + dataclasses

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/Roy-Wanyoike/Ryvex"
Documentation = "https://github.com/Roy-Wanyoike/Ryvex/blob/main/docs/api-contracts.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ryvex = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
